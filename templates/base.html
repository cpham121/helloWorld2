<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}HelloWorld{% endblock %} | Celia Pham</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Added Navigation bar !-->
    <nav class="navbar navbar-dark bg-dark" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand" href="/hello">Celia Pham</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" href="/favorite-course?subject=BMGT&amp;course_number=403">Favorite Course</a>
                <a class="nav-link" href="/contact">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        {% block content %}{% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container pb-4 text-center text-secondary">
        <p class="mb-0">Celia Pham | BMGT 407 | University of Maryland</p>
    </footer>
</body>
</html>
