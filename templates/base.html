<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
  <body>
  <nav class="navbar navbar-dark student-navbar">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('student_view_all') }}">University Students</a>
    <div id="navbarSupportedContent">
      <ul class="navbar-nav flex-row gap-4">
        <li class="nav-item">
          <a class="nav-link px-2" href="{{ url_for('student_view_all') }}">View All Students</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-2" href="{{ url_for('student_create') }}">Add New Student</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

    <main class="container page-content">
        <h1>{% block page_head %}{% endblock %}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ 'alert-success' if category == 'success' else 'alert-danger' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block page_content %}{% endblock %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
